services:
  db-master:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REPLICATION_USER: ${REPLICATION_USER:-replicator}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-rep_password}
    command: >
      postgres -c wal_level=replica
               -c max_wal_senders=10
               -c max_replication_slots=10
               -c hot_standby=on
               -c hba_file=/etc/postgresql/pg_hba.conf
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./docker/replication/master-init.sh:/docker-entrypoint-initdb.d/master-init.sh:ro
      - ./docker/replication/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - master-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  db-slave1:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REPLICATION_USER: ${REPLICATION_USER:-replicator}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-rep_password}
      MASTER_HOST: ${SLAVE1_MASTER:-db-master}
      APPLICATION_NAME: slave1
    entrypoint: ["/replica-entrypoint.sh"]
    command: ["postgres"]
    volumes:
      - ./docker/replication/replica-entrypoint.sh:/replica-entrypoint.sh:ro
      - slave1-data:/var/lib/postgresql/data
    ports:
      - "15433:5432"
    depends_on:
      db-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 60

  db-slave2:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REPLICATION_USER: ${REPLICATION_USER:-replicator}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-rep_password}
      MASTER_HOST: ${SLAVE2_MASTER:-db-master}
      APPLICATION_NAME: slave2
    entrypoint: ["/replica-entrypoint.sh"]
    command: ["postgres"]
    volumes:
      - ./docker/replication/replica-entrypoint.sh:/replica-entrypoint.sh:ro
      - slave2-data:/var/lib/postgresql/data
    ports:
      - "15434:5432"
    depends_on:
      db-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 60

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://${APP_DB_HOST:-db-master}:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # REPLICA_URLS="" (пустая строка) => приложение работает только с мастером (базовый замер);
      # форма ${VAR-default} (без ':') позволяет передать пустое значение явно.
      REPLICA_URLS: ${REPLICA_URLS-jdbc:postgresql://db-slave1:5432/${POSTGRES_DB},jdbc:postgresql://db-slave2:5432/${POSTGRES_DB}}
    ports:
      - "8080:8080"
    depends_on:
      db-master:
        condition: service_healthy

volumes:
  master-data:
  slave1-data:
  slave2-data:
